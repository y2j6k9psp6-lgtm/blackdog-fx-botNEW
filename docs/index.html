<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐕 Black Dog FX Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0f; color: #e0e0e0; font-family: 'Segoe UI', Arial, sans-serif; min-height: 100vh; }
    header { background: linear-gradient(135deg, #0d0d1a, #111128); border-bottom: 1px solid #1e1e3a; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .header-left h1 { font-size: 1.4rem; font-weight: 700; color: #fff; }
    .header-left p  { font-size: 0.75rem; color: #777; margin-top: 2px; }
    .header-right   { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .last-updated   { font-size: 0.75rem; color: #aaa; }
    .refresh-bar    { display: flex; align-items: center; gap: 8px; }
    .refresh-label  { font-size: 0.7rem; color: #555; }
    .countdown      { font-size: 0.75rem; font-weight: 700; color: #4caf8a; min-width: 28px; text-align: right; }
    .progress-track { width: 90px; height: 3px; background: #1e1e3a; border-radius: 2px; overflow: hidden; }
    .progress-fill  { height: 100%; background: linear-gradient(90deg, #4caf8a, #2196f3); transition: width 1s linear; }
    .tab-bar { display: flex; background: #0d0d1a; border-bottom: 1px solid #1e1e3a; padding: 0 24px; }
    .tab-btn { padding: 12px 24px; font-size: 0.85rem; font-weight: 600; color: #555; cursor: pointer; border: none; background: none; border-bottom: 3px solid transparent; transition: all 0.2s; }
    .tab-btn:hover { color: #aaa; }
    .tab-btn.active { color: #4caf8a; border-bottom-color: #4caf8a; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .summary-bar { display: flex; gap: 24px; padding: 10px 24px; background: #0d0d1a; border-bottom: 1px solid #151530; flex-wrap: wrap; }
    .summary-item { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; }
    .sdot { width: 9px; height: 9px; border-radius: 50%; }
    .sdot-buy { background: #4caf8a; } .sdot-sell { background: #f44336; } .sdot-wait { background: #444; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; padding: 20px 24px; max-width: 1400px; margin: 0 auto; }
    .card { background: #0f0f1e; border: 1px solid #1a1a35; border-radius: 10px; overflow: hidden; transition: transform 0.15s; }
    .card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
    .card.buy { border-color: #1a3a2a; } .card.sell { border-color: #3a1a1a; }
    .card-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px 6px; }
    .pair-name { font-size: 1.1rem; font-weight: 800; color: #fff; letter-spacing: 1px; }
    .dir-badge { font-size: 0.65rem; font-weight: 700; padding: 3px 7px; border-radius: 20px; }
    .dir-bull { background: rgba(76,175,138,0.15); color: #4caf8a; }
    .dir-bear { background: rgba(244,67,54,0.15); color: #f44336; }
    .price-row { padding: 2px 14px 8px; font-size: 0.95rem; font-weight: 600; color: #c0c0d0; font-family: monospace; }
    .sig-badge { margin: 0 14px 10px; padding: 9px; border-radius: 7px; text-align: center; font-size: 1rem; font-weight: 800; }
    .sig-buy  { background: rgba(76,175,138,0.12); color: #4caf8a; border: 1px solid #1d3a2a; }
    .sig-sell { background: rgba(244,67,54,0.10); color: #f44336; border: 1px solid #3a1d1d; }
    .sig-wait { background: rgba(60,60,100,0.10); color: #6868a0; border: 1px solid #222245; }
    .conds { padding: 0 14px 10px; display: flex; flex-direction: column; gap: 5px; }
    .cond-row { display: flex; align-items: center; justify-content: space-between; font-size: 0.74rem; }
    .cond-lbl { color: #777; display: flex; align-items: center; gap: 5px; }
    .cdot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .cdot.on { background: #4caf8a; box-shadow: 0 0 4px rgba(76,175,138,0.5); }
    .cdot.off { background: #252535; }
    .cval.on { color: #4caf8a; font-size: 0.7rem; font-weight: 600; }
    .cval.off { color: #333; font-size: 0.7rem; }
    .meter { display: flex; justify-content: center; gap: 4px; padding: 6px 14px 12px; border-top: 1px solid #131325; align-items: center; }
    .mdot { width: 9px; height: 9px; border-radius: 50%; background: #1a1a2e; }
    .mdot.on { background: #4caf8a; }
    .mdot.on.sell { background: #f44336; }
    .charts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(580px, 1fr)); gap: 20px; padding: 20px 24px; max-width: 1400px; margin: 0 auto; }
    .chart-card { background: #0f0f1e; border: 1px solid #1a1a35; border-radius: 12px; overflow: hidden; }
    .chart-card.buy { border-color: #1a3a2a; } .chart-card.sell { border-color: #3a1a1a; }
    .chart-card-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px 10px; }
    .chart-pair { font-size: 1.3rem; font-weight: 800; color: #fff; letter-spacing: 1px; }
    .chart-price { font-size: 0.9rem; color: #888; font-family: monospace; margin-top: 2px; }
    .chart-img-wrap { background: #0a0a0f; border-top: 1px solid #151530; border-bottom: 1px solid #151530; }
    .chart-img { width: 100%; display: block; }
    .chart-no-img { height: 160px; display: flex; align-items: center; justify-content: center; color: #333; font-size: 0.8rem; }
    .rationale { padding: 14px 18px 16px; display: flex; flex-direction: column; gap: 10px; }
    .rat-row { display: flex; gap: 12px; align-items: flex-start; }
    .rat-icon { font-size: 1rem; flex-shrink: 0; margin-top: 1px; }
    .rat-body { flex: 1; }
    .rat-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
    .rat-label.on { color: #4caf8a; } .rat-label.off { color: #555; }
    .rat-text { font-size: 0.78rem; line-height: 1.5; }
    .rat-text.on { color: #b0c0b0; } .rat-text.off { color: #484858; }
    .rat-divider { border: none; border-top: 1px solid #151530; }
    .loading { text-align: center; padding: 50px 20px; color: #444; font-size: 0.95rem; grid-column: 1 / -1; }
    .spinner { font-size: 2rem; animation: spin 1.5s linear infinite; display: block; margin-bottom: 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    footer { text-align: center; padding: 18px; color: #2a2a3a; font-size: 0.7rem; border-top: 1px solid #111125; margin-top: 16px; }
    @media (max-width: 640px) { .charts-grid { grid-template-columns: 1fr; padding: 12px; } .grid { padding: 12px; } header { padding: 12px 16px; } }
  </style>
</head>
<body>
<header>
  <div class="header-left">
    <h1>🐕 Black Dog FX Dashboard</h1>
    <p>Bill Dow's System — 10 Major Pairs — 3-Layer MTF (15M entry | 1H confirm | 4H trend)</p>
  </div>
  <div class="header-right">
    <span class="last-updated" id="last-updated">Loading...</span>
    <div class="refresh-bar">
      <span class="refresh-label">Refreshes in</span>
      <span class="countdown" id="countdown">60s</span>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
  </div>
</header>
<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('overview',this)">📊 Overview</button>
  <button class="tab-btn" onclick="switchTab('charts',this)">📈 Charts &amp; Analysis</button>
</div>
<div class="summary-bar" id="summary-bar">
  <span class="summary-item"><span class="sdot sdot-wait"></span>Loading...</span>
</div>
<div id="tab-overview" class="tab-content active">
  <div class="grid" id="overview-grid">
    <div class="loading"><span class="spinner">🐕</span>Loading signals...</div>
  </div>
</div>
<div id="tab-charts" class="tab-content">
  <div class="charts-grid" id="charts-grid">
    <div class="loading"><span class="spinner">🐕</span>Loading charts...</div>
  </div>
</div>
<footer>Black Dog FX System by Bill Dow &nbsp;·&nbsp; Signals check every 5 min &nbsp;·&nbsp; Dashboard refreshes every 60s</footer>
<script>
  const REFRESH = 60;
  let countdown = REFRESH;
  const COND_META = {
    trend:   { icon: "📊", label: "15M Trend Background"      },
    channel: { icon: "📈", label: "Price vs Channel (50 EMA)" },
    macd:    { icon: "📉", label: "MACD 15M (10-20-1)"        },
    mtf_1h:  { icon: "🕐", label: "1H MACD Confirmation"      },
    mtf_4h:  { icon: "📅", label: "4H Trend Filter"           },
    ses:     { icon: "⚡", label: "SES Entry Arrow"           },
  };
  const SIG = {
    BUY:  { label: "🚀  BUY",  cls: "buy",  badge: "sig-buy",  dot: ""     },
    SELL: { label: "💥  SELL", cls: "sell", badge: "sig-sell", dot: "sell" },
    WAIT: { label: "⏳  WAIT", cls: "wait", badge: "sig-wait", dot: ""     },
  };
  function switchTab(name, btn) {
    document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.getElementById("tab-" + name).classList.add("active");
    btn.classList.add("active");
  }
  async function fetchStatus() {
    try {
      const res = await fetch("status.json?t=" + Date.now());
      const data = await res.json();
      render(data);
    } catch(e) {
      document.getElementById("overview-grid").innerHTML = '<div class="loading">Could not load data. Bot may still be running.</div>';
    }
  }
  function render(data) {
    document.getElementById("last-updated").textContent = "Last data: " + (data.last_updated || "—");
    const pairs = data.pairs || [];
    const buys  = pairs.filter(p => p.signal === "BUY").length;
    const sells = pairs.filter(p => p.signal === "SELL").length;
    const waits = pairs.filter(p => p.signal === "WAIT").length;
    document.getElementById("summary-bar").innerHTML = `
      <span class="summary-item"><span class="sdot sdot-buy"></span>${buys} BUY</span>
      <span class="summary-item"><span class="sdot sdot-sell"></span>${sells} SELL</span>
      <span class="summary-item"><span class="sdot sdot-wait"></span>${waits} Waiting</span>
      <span class="summary-item" style="margin-left:auto;color:#444;font-size:0.72rem">Entry: ${data.timeframe||"—"} | 1H: ${data.mtf_1h||"1h"} | 4H: ${data.mtf_4h||"4h"}</span>`;
    if (!pairs.length) {
      const msg = '<div class="loading"><span class="spinner">🐕</span>No data yet — waiting for first bot run.</div>';
      document.getElementById("overview-grid").innerHTML = msg;
      document.getElementById("charts-grid").innerHTML  = msg;
      return;
    }
    const sorted = [...pairs].sort((a,b) => ({BUY:0,SELL:1,WAIT:2}[a.signal]||2) - ({BUY:0,SELL:1,WAIT:2}[b.signal]||2));
    document.getElementById("overview-grid").innerHTML = sorted.map(overviewCard).join("");
    document.getElementById("charts-grid").innerHTML   = sorted.map(chartCard).join("");
  }
  function overviewCard(p) {
    const s   = SIG[p.signal] || SIG.WAIT;
    const dir = p.direction === "BULL";
    const condRows = Object.entries(COND_META).map(([k, m]) => {
      const on = p.conditions && p.conditions[k] === true;
      return `<div class="cond-row"><span class="cond-lbl"><span class="cdot ${on?"on":"off"}"></span>${m.icon} ${m.label}</span><span class="cval ${on?"on":"off"}">${on?"✓ YES":"✗ NO"}</span></div>`;
    }).join("");
    const met   = p.conditions_met || 0;
    const total = Object.keys(COND_META).length;
    const dots  = Array.from({length: total}, (_,i) => `<div class="mdot ${i < met ? "on " + s.dot : ""}"></div>`).join("");
    return `<div class="card ${s.cls}">
      <div class="card-header"><span class="pair-name">${p.symbol}</span><span class="dir-badge ${dir?"dir-bull":"dir-bear"}">${dir?"▲ BULL":"▼ BEAR"}</span></div>
      <div class="price-row">${p.price}</div>
      <div class="sig-badge ${s.badge}">${s.label}</div>
      <div class="conds">${condRows}</div>
      <div class="meter">${dots}<span style="font-size:0.65rem;color:#333;margin-left:6px">${met}/${total}</span></div>
    </div>`;
  }
  function chartCard(p) {
    const s   = SIG[p.signal] || SIG.WAIT;
    const dir = p.direction === "BULL";
    const ts  = Date.now();
    const rationale = (p.rationale || []).map((r, i) => `
      ${i > 0 ? '<hr class="rat-divider">' : ""}
      <div class="rat-row"><span class="rat-icon">${r.icon}</span>
        <div class="rat-body">
          <div class="rat-label ${r.met?"on":"off"}">${r.label} — ${r.met?"✓ CONFIRMED":"✗ NOT YET"}</div>
          <div class="rat-text ${r.met?"on":"off"}">${r.text}</div>
        </div>
      </div>`).join("");
    return `<div class="chart-card ${s.cls}">
      <div class="chart-card-header">
        <div>
          <div class="chart-pair">${p.symbol} <span class="dir-badge ${dir?"dir-bull":"dir-bear"}" style="margin-left:8px">${dir?"▲ BULL":"▼ BEAR"}</span></div>
          <div class="chart-price">${p.price}</div>
        </div>
        <div class="sig-badge ${s.badge}" style="margin:0;padding:10px 18px">${s.label}</div>
      </div>
      <div class="chart-img-wrap">
        <img class="chart-img" src="charts/${p.symbol}.png?t=${ts}" alt="${p.symbol} chart"
             onerror="this.parentElement.innerHTML='<div class=\\'chart-no-img\\'>📊 Chart generates on next bot run</div>'">
      </div>
      <div class="rationale">${rationale}</div>
    </div>`;
  }
  setInterval(() => {
    countdown--;
    document.getElementById("countdown").textContent = countdown + "s";
    document.getElementById("progress-fill").style.width = ((countdown / REFRESH) * 100) + "%";
    if (countdown <= 0) { countdown = REFRESH; fetchStatus(); }
  }, 1000);
  fetchStatus();
</script>
</body>
</html>
